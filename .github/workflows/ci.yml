# Static checks plus unit, integration and contract tests on the small fixture, and the docs check.
# The real-app smoke, full-DB, e2e and live tests run locally only (ARCHITECTURE §6).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_docs.py compares against main

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python packages (locked)
        run: uv sync --locked

      - name: Install front-end packages (locked)
        run: npm ci
        working-directory: web

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: TypeScript and ESLint
        run: |
          npm run typecheck
          npm run lint
        working-directory: web

      - name: Build the front end
        run: npm run build
        working-directory: web

      - name: Unit, integration and contract tests
        run: uv run pytest

      - name: Docs check
        run: uv run python scripts/check_docs.py --base origin/main
